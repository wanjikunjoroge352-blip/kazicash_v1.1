<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw to M-Pesa - KaziCash</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-sm border border-gray-100">
    
    <!-- Header -->
    <div class="flex items-center mb-6">
      <a href="/" class="text-gray-500 hover:text-gray-900 text-sm font-semibold mr-4">← Back</a>
      <h1 class="text-lg font-bold text-gray-900">Withdraw to M-Pesa</h1>
    </div>

    <!-- Form -->
    <form id="withdrawForm" onsubmit="handleWithdraw(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">M-Pesa Phone Number</label>
        <input 
          type="tel" 
          id="phone" 
          placeholder="2547XXXXXXXX" 
          required 
          class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-emerald-500"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Amount (KES)</label>
        <input 
          type="number" 
          id="amount" 
          placeholder="50" 
          min="1" 
          required 
          class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-emerald-500"
        />
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-2xl text-center transition shadow-sm text-sm mt-2"
      >
        Request M-Pesa Push
      </button>
    </form>

    <div id="statusMessage" class="mt-4 text-center text-xs font-medium"></div>

  </div>

  <script>
    async function handleWithdraw(event) {
      event.preventDefault();
      const phone = document.getElementById('phone').value;
      const amount = document.getElementById('amount').value;
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMessage');

      btn.disabled = true;
      btn.innerText = 'Processing...';
      status.className = 'mt-4 text-center text-xs font-medium text-gray-500';
      status.innerText = 'Sending STK Push to your phone...';

      try {
        const response = await fetch('/api/withdraw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount })
        });

        const data = await response.json();

        if (response.ok) {
          status.className = 'mt-4 text-center text-xs font-medium text-emerald-600';
          status.innerText = 'Success! Check your phone for the M-Pesa prompt.';
        } else {
          status.className = 'mt-4 text-center text-xs font-medium text-red-600';
          status.innerText = data.error || 'Withdrawal failed. Try again.';
        }
      } catch (err) {
        status.className = 'mt-4 text-center text-xs font-medium text-red-600';
        status.innerText = 'Network error. Please check your connection.';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Request M-Pesa Push';
      }
    }
  </script>
</body>
</html>
