<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw to M-Pesa - KaziCash</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-sm border border-gray-100 space-y-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between">
      <a href="/" class="text-gray-500 text-sm font-semibold hover:text-gray-800">← Back</a>
      <h1 class="text-lg font-bold text-gray-900">Withdraw to M-Pesa</h1>
      <span></span>
    </div>

    <!-- Withdrawal Form -->
    <form id="withdrawForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">M-Pesa Phone Number</label>
        <input 
          type="tel" 
          id="phone" 
          placeholder="07XXXXXXXX or 2547XXXXXXXX" 
          required
          class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 text-sm text-gray-800 focus:outline-none focus:border-emerald-500"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Amount (KES)</label>
        <input 
          type="number" 
          id="amount" 
          placeholder="0.00" 
          required
          class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3.5 text-sm text-gray-800 focus:outline-none focus:border-emerald-500"
        >
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-2xl text-center transition shadow-sm text-sm"
      >
        Withdraw Funds
      </button>
    </form>

    <!-- Status Message Box -->
    <div id="statusMessage" class="hidden text-center text-xs font-semibold p-3 rounded-xl"></div>

  </div>

  <script>
    const form = document.getElementById('withdrawForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phone = document.getElementById('phone').value.trim();
      const amount = document.getElementById('amount').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';
      statusBox.classList.add('hidden');

      try {
        const response = await fetch('/api/withdraw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount })
        });

        const result = await response.json();

        statusBox.classList.remove('hidden');
        if (response.ok) {
          statusBox.className = 'text-center text-xs font-semibold p-3 rounded-xl bg-emerald-50 text-emerald-700';
          statusBox.textContent = result.message || 'Withdrawal request submitted successfully!';
          form.reset();
        } else {
          statusBox.className = 'text-center text-xs font-semibold p-3 rounded-xl bg-red-50 text-red-700';
          statusBox.textContent = result.error || 'Something went wrong.';
        }
      } catch (err) {
        statusBox.classList.remove('hidden');
        statusBox.className = 'text-center text-xs font-semibold p-3 rounded-xl bg-red-50 text-red-700';
        statusBox.textContent = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Withdraw Funds';
      }
    });
  </script>

</body>
</html>
