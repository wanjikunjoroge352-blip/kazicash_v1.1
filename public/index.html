<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - KaziCash</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-sm border border-gray-100 space-y-6">
    
    <!-- User Header -->
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Hi, Wanjiku Njoroge</h1>
        <p class="text-xs text-emerald-600 font-semibold flex items-center gap-1 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Active Account
        </p>
      </div>
      <span class="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1.5 rounded-full">#12</span>
    </div>

    <!-- Balance Card -->
    <div class="bg-blue-600 text-white rounded-2xl p-5 shadow-md">
      <p class="text-xs uppercase tracking-wider font-semibold text-blue-200">Available Balance</p>
      <h2 class="text-3xl font-black mt-1">KES 0.00</h2>
    </div>

    <!-- Withdraw Button (Clickable Link to /withdraw) -->
    <a href="/withdraw" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-2xl text-center block transition shadow-sm text-sm">
      Withdraw to M-Pesa
    </a>

    <!-- Tasks Section -->
    <div>
      <h3 class="text-sm font-bold text-gray-900 mb-3">Available Money Tasks</h3>
      
      <div class="space-y-3">
        <!-- Task 1 -->
        <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 flex justify-between items-center">
          <div>
            <h4 class="text-sm font-bold text-gray-800">Market Opinion Survey</h4>
            <p class="text-xs text-gray-400">Takes ~3 mins (CPALead)</p>
          </div>
          <span class="bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ KES 15</span>
        </div>

        <!-- Task 2 -->
        <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 flex justify-between items-center">
          <div>
            <h4 class="text-sm font-bold text-gray-800">Watch Partner Video</h4>
            <p class="text-xs text-gray-400">30-second ad view</p>
          </div>
          <span class="bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ KES 5</span>
        </div>

        <!-- Task 3 -->
        <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 flex justify-between items-center">
          <div>
            <h4 class="text-sm font-bold text-gray-800">Invite a Friend</h4>
            <p class="text-xs text-gray-400">Share your code</p>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
